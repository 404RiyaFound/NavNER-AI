<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1C1C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C2C2E;stop-opacity:1" />
    </linearGradient>
    <!-- Orange accent gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7A3D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF5B22;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="0" y="0" width="560" height="120" rx="16" fill="url(#bgGrad)"/>
  <!-- Subtle border -->
  <rect x="0.5" y="0.5" width="559" height="119" rx="15.5" fill="none" stroke="#3F3F46" stroke-width="1"/>

  <!-- ===== ICON / LOGO MARK ===== -->
  <!-- Icon background pill -->
  <rect x="16" y="16" width="88" height="88" rx="20" fill="url(#orangeGrad)" filter="url(#softglow)" opacity="0.15"/>
  <rect x="16" y="16" width="88" height="88" rx="20" fill="url(#orangeGrad)" opacity="0.08"/>

  <!-- Route path lines (map network) -->
  <!-- Horizontal base line -->
  <line x1="28" y1="84" x2="92" y2="84" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <!-- Main route: curved upward path with orange accent -->
  <path d="M 32 80 C 42 60, 52 50, 60 44 C 68 38, 76 42, 92 36" 
        stroke="url(#orangeGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Secondary route (grey, normal) -->
  <path d="M 32 80 C 45 72, 58 68, 76 66 C 84 64, 88 60, 92 52" 
        stroke="#6B7280" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Node dots on the main route -->
  <!-- Start node -->
  <circle cx="32" cy="80" r="4" fill="#2C2C2E" stroke="url(#orangeGrad)" stroke-width="2"/>
  
  <!-- Mid node (reroute point) - highlighted -->
  <circle cx="60" cy="44" r="5.5" fill="url(#orangeGrad)" filter="url(#glow)"/>
  <circle cx="60" cy="44" r="3" fill="#1C1C1C"/>
  
  <!-- End node (destination) -->
  <circle cx="92" cy="36" r="4" fill="url(#orangeGrad)" filter="url(#glow)"/>
  
  <!-- Destination pin top -->
  <path d="M 92 28 C 88 28, 85 31, 85 35 C 85 39, 88.5 43, 92 47 C 95.5 43, 99 39, 99 35 C 99 31, 96 28, 92 28 Z"
        fill="url(#orangeGrad)" filter="url(#softglow)"/>
  <circle cx="92" cy="35" r="3" fill="#1C1C1C"/>

  <!-- Small vehicle dot on the route -->
  <circle cx="46" cy="67" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="46" cy="67" r="5" fill="#FFFFFF" opacity="0.15"/>

  <!-- H3 Hexagon grid (subtle, bottom left of icon area) -->
  <polygon points="38,90 44,87 50,90 50,96 44,99 38,96" fill="none" stroke="#4B5563" stroke-width="1" opacity="0.5"/>
  <polygon points="50,90 56,87 62,90 62,96 56,99 50,96" fill="none" stroke="#4B5563" stroke-width="1" opacity="0.5"/>

  <!-- ===== TEXT ===== -->
  <!-- Main title -->
  <text x="122" y="52" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Nav</text>
  <text x="186" y="52" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="url(#orangeGrad)" letter-spacing="-0.5">NER</text>
  <text x="248" y="52" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">·AI</text>

  <!-- Tagline -->
  <text x="122" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" fill="#9CA3AF" letter-spacing="0.2">AI-Powered Logistics Intelligence · North Eastern Region</text>

  <!-- Tag pills row -->
  <!-- Pill 1: FastAPI -->
  <rect x="122" y="83" width="62" height="20" rx="10" fill="#FF5B2218"/>
  <rect x="122" y="83" width="62" height="20" rx="10" fill="none" stroke="#FF5B2244" stroke-width="1"/>
  <text x="153" y="97" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#FF5B22" text-anchor="middle" font-weight="600">FastAPI</text>

  <!-- Pill 2: React -->
  <rect x="190" y="83" width="52" height="20" rx="10" fill="#61DAFB14"/>
  <rect x="190" y="83" width="52" height="20" rx="10" fill="none" stroke="#61DAFB33" stroke-width="1"/>
  <text x="216" y="97" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#61DAFB" text-anchor="middle" font-weight="600">React</text>

  <!-- Pill 3: Expo -->
  <rect x="248" y="83" width="46" height="20" rx="10" fill="#FFFFFF0D"/>
  <rect x="248" y="83" width="46" height="20" rx="10" fill="none" stroke="#FFFFFF22" stroke-width="1"/>
  <text x="271" y="97" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#D1D5DB" text-anchor="middle" font-weight="600">Expo</text>

  <!-- Pill 4: PostGIS -->
  <rect x="300" y="83" width="60" height="20" rx="10" fill="#34D39914"/>
  <rect x="300" y="83" width="60" height="20" rx="10" fill="none" stroke="#34D39933" stroke-width="1"/>
  <text x="330" y="97" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#34D399" text-anchor="middle" font-weight="600">PostGIS</text>

  <!-- Orange accent line on the right edge -->
  <rect x="546" y="16" width="4" height="88" rx="2" fill="url(#orangeGrad)" opacity="0.6"/>
</svg>
