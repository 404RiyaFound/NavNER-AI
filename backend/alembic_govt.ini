# Alembic configuration for the Fleet Manager database.
#
# Separate from alembic.ini / migrations/ on purpose — this is a genuinely
# different database (GOVT_DATABASE_URL), not a second schema in the same
# one, and it has its own model Base (app.govt_models.GovtBase). Run with:
#   alembic -c alembic_govt.ini upgrade head
[alembic]
script_location = migrations_govt
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
