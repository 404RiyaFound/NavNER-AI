name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Welcome First-Time Contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to NavNER-AI! Thank you for opening your first issue. 
            
            We appreciate your contribution. A maintainer will review this shortly. In the meantime, make sure you have provided all the necessary details and checked out our [Contributing Guidelines](CONTRIBUTING.md).
          pr-message: |
            🎉 Welcome to NavNER-AI! Thank you for creating your first pull request!
            
            We are thrilled to have you contribute to our project. A maintainer will review your code as soon as possible. Please make sure your PR follows our [Contributing Guidelines](CONTRIBUTING.md).
