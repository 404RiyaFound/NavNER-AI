version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Backend (Python)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # Web (npm)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"

  # Mobile (npm)
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"

  # Infrastructure (Python/CDK)
  - package-ecosystem: "pip"
    directory: "/infra"
    schedule:
      interval: "weekly"
